[package]
name = "wtm"
description = "Worktree manager: a pool of bare git repositories and their worktrees"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_mangen = "0.3.3"
wtm-core = { version = "0.2.0", path = "../wtm-core" }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints]
workspace = true

# Packages are built by packaging/build-packages.sh, which first generates
# the man pages and completion files into target/assets.

[package.metadata.deb]
maintainer = "Max Sikström <max@pengi.se>"
copyright = "Max Sikström"
license-file = ["../LICENSE", "0"]
extended-description = """\
wtm keeps a pool of git checkouts: registered upstream repositories are \
kept as bare repositories in one directory, and any number of worktrees \
are created from them in another."""
depends = "git (>= 1:2.30), curl"
section = "vcs"
priority = "optional"
assets = [
    ["target/release/wtm", "usr/bin/", "755"],
    ["../target/assets/man/*", "usr/share/man/man1/", "644"],
    ["../target/assets/completions/wtm.bash", "usr/share/bash-completion/completions/wtm", "644"],
    ["../target/assets/completions/_wtm", "usr/share/zsh/vendor-completions/_wtm", "644"],
    ["../README.md", "usr/share/doc/wtm/README.md", "644"],
]

[package.metadata.generate-rpm]
summary = "Worktree manager: a pool of bare git repositories and their worktrees"
assets = [
    { source = "target/release/wtm", dest = "/usr/bin/wtm", mode = "755" },
    { source = "target/assets/man/*", dest = "/usr/share/man/man1/", mode = "644", doc = true },
    { source = "target/assets/completions/wtm.bash", dest = "/usr/share/bash-completion/completions/wtm", mode = "644" },
    { source = "target/assets/completions/_wtm", dest = "/usr/share/zsh/site-functions/_wtm", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/wtm/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/wtm/README.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
git = ">= 2.30"
curl = "*"
